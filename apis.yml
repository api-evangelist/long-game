name: Long Game
description: Long Game was a San Francisco fintech startup founded in 2015 by Lindsay
  Holden that used prize-linked savings and casual mobile gaming to help Gen-Z and
  millennial consumers build healthy financial habits and grow their savings. Backed
  by Obvious Ventures and others (raising over $20M in venture capital), Long Game
  was acquired by Truist Financial in May 2022 and folded into Truist Foundry, which
  relaunched the Long Game app in May 2023. It is a consumer mobile product with no
  public developer API surface, and the standalone longgame.co domain no longer resolves.
